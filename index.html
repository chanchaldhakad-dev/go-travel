<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Explorer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: rgba(0, 0, 0, 0.4);
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 1px;
      color: #00E6F6;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 30px;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #00E6F6;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.45);
      padding: 40px;
    }

    .hero h2 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
      max-width: 600px;
    }

    .btn {
      background: #00E6F6;
      color: black;
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: white;
      color: #00E6F6;
      transform: scale(1.05);
    }

    footer {
      background: rgba(0, 0, 0, 0.6);
      text-align: center;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>TravelExplorer</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Destinations</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <div class="hero">
    <h2>Explore the World with Us 🌍</h2>
    <p>Discover breathtaking destinations, experience new cultures, and make memories that last forever.</p>
    <button class="btn">Get Started</button>
  </div>

  <footer>
    © 2025 TravelExplorer | Designed with ❤️ by Chanchal Dhakad
  </footer>

</body>
</html>
